<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mga Kandidato - TINDIG-CEMDS</title>
<meta name="description" content="Kilalanin ang apat na kandidato sa pagka-senador ng TINDIG-CEMDS para sa 2026 Student Council Elections.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-navbar"></div>

<main style="padding-top: 84px;">

    <div class="page-header">
        <div class="container reveal">
            <div class="eyebrow justify-content-center">2026 Senatorial Slate</div>
            <h1>Kilalanin ang mga Kandidato sa Pagka-Senador</h1>
            <p>Ang apat na kandidato ng TINDIG-CEMDS: mga estudyanteng handang makinig, kumilos, at manindigan.</p>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div id="candidates-grid" class="row g-4">
                <!-- Candidate cards are rendered dynamically by js/script.js -->
            </div>
        </div>
    </section>

    <section class="vote-band">
        <div class="container reveal">
            <h2>Ang boto mo ay boses mo.</h2>
            <p>Kasama ka sa bawat hakbang.</p>
            <a href="gpoa.html" class="btn-campaign btn-campaign-white">Aming GPOA</a>
        </div>
    </section>

</main>

<div id="site-footer"></div>

<button id="backToTop" class="back-to-top" aria-label="Back to top">&uarr;</button>

<!-- Candidate Profile Modal -->
<div class="modal fade modal-candidate" id="candidateModal" tabindex="-1" aria-labelledby="candidateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div class="d-flex align-items-center gap-3">
                    <img id="candidateModalPhoto" src="" alt="" class="modal-candidate-photo">
                    <div>
                        <h5 class="modal-title mb-0" id="candidateModalLabel"><span id="candidateModalName"></span></h5>
                        <div id="candidateModalPosition" class="small"></div>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="candidateModalBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
